name: Build Striker FC APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" | grep -E '^android-34$' || echo "platform 34 missing"
          ls "$ANDROID_HOME/build-tools" | grep -E '^34\.0\.0$' || echo "build-tools 34.0.0 missing"

      - name: Install missing Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v3

      - name: Decode base64 files
        run: |
          find . -name '*.b64' -print0 | while IFS= read -r -d '' f; do
            base64 -d "$f" > "${f%.b64}"
            rm "$f"
          done
          ls -la vendor/

      - name: Install JS deps
        run: npm ci --ignore-scripts

      - name: Sync Capacitor web assets
        run: npx cap sync

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
        working-directory: android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: striker-fc-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
