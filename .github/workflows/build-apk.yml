name: Build Striker FC APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" | grep -E '^android-34$' || echo "platform 34 missing"
          ls "$ANDROID_HOME/build-tools" | grep -E '^34\.0\.0$' || echo "build-tools 34.0.0 missing"

      - name: Install missing Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v3

      - name: Decode base64 files
        run: |
          find . -name '*.b64' -print0 | while IFS= read -r -d '' f; do
            base64 -d "$f" > "${f%.b64}"
            rm "$f"
          done
          ls -la vendor/

      - name: Install JS deps
        run: npm ci --ignore-scripts

      - name: Sync web assets into Android project
        run: |
          mkdir -p android/app/src/main/assets
          rm -rf android/app/src/main/assets/public
          cp -r dist android/app/src/main/assets/public
          test -f android/app/src/main/assets/public/index.html || { echo "SYNC FAILED: public/index.html missing"; exit 1; }
          cat > android/app/src/main/assets/capacitor.config.json <<'EOF'
          {
            "appId": "com.strikerfc.app",
            "appName": "Striker FC",
            "webDir": "dist",
            "backgroundColor": "#0b0e1a",
            "android": {
              "allowMixedContent": false,
              "captureInput": true
            },
            "ios": {
              "contentInset": "never"
            },
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 1200,
                "launchAutoHide": true,
                "backgroundColor": "#0b0e1a",
                "androidSplashResourceName": "splash",
                "androidScaleType": "CENTER_CROP",
                "showSpinner": false
              },
              "StatusBar": {
                "overlaysWebView": true,
                "style": "DARK",
                "backgroundColor": "#0b0e1a"
              }
            }
          }
          EOF
          printf '[]' > android/app/src/main/assets/capacitor.plugins.json
          ls android/app/src/main/assets/public | head

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon 2>&1 | tee /tmp/gradle.log; test ${PIPESTATUS[0]} -eq 0
        working-directory: android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: striker-fc-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Report failure as issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; echo; echo "--- assets/public ---"; ls android/app/src/main/assets/public 2>&1 | head -20; echo; echo "--- gradle log (last 120 lines) ---"; tail -n 120 /tmp/gradle.log 2>/dev/null || echo "no gradle log"; } > /tmp/failure-report.txt
          gh issue create --title "APK build failed (run ${{ github.run_id }})" --body-file /tmp/failure-report.txt || echo "could not create issue"
