name: Build Striker FC APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" | grep -E '^android-34$' || echo "platform 34 missing"
          ls "$ANDROID_HOME/build-tools" | grep -E '^34\.0\.0$' || echo "build-tools 34.0.0 missing"

      - name: Install missing Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v3

      - name: Decode base64 files
        run: |
          find . -name '*.b64' -print0 | while IFS= read -r -d '' f; do
            base64 -d "$f" > "${f%.b64}"
            rm "$f"
          done
          ls -la vendor/

      - name: Install JS deps
        run: npm ci --ignore-scripts

      - name: Sync web assets into Android project
        run: |
          mkdir -p android/app/src/main/assets
          rm -rf android/app/src/main/assets/public
          cp -r dist android/app/src/main/assets/public
          test -f android/app/src/main/assets/public/index.html || { echo "SYNC FAILED: public/index.html missing"; exit 1; }
          cat > android/app/src/main/assets/capacitor.config.json <<'EOF'
          {
            "appId": "com.strikerfc.app",
            "appName": "Striker FC",
            "webDir": "dist",
            "backgroundColor": "#0b0e1a",
            "android": {
              "allowMixedContent": false,
              "captureInput": true
            },
            "ios": {
              "contentInset": "never"
            },
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 1200,
                "launchAutoHide": true,
                "backgroundColor": "#0b0e1a",
                "androidSplashResourceName": "splash",
                "androidScaleType": "CENTER_CROP",
                "showSpinner": false
              },
              "StatusBar": {
                "overlaysWebView": true,
                "style": "DARK",
                "backgroundColor": "#0b0e1a"
              }
            }
          }
          EOF
          printf '[]' > android/app/src/main/assets/capacitor.plugins.json
          ls android/app/src/main/assets/public | head

      - name: Recreate Cordova plugins module (git-ignored, cap sync made it)
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          if [ ! -d android/capacitor-cordova-android-plugins ]; then
            mkdir -p android/capacitor-cordova-android-plugins/src/main/java android/capacitor-cordova-android-plugins/src/main/res
            touch android/capacitor-cordova-android-plugins/src/main/java/.gitkeep android/capacitor-cordova-android-plugins/src/main/res/.gitkeep
            cat > android/capacitor-cordova-android-plugins/cordova.variables.gradle <<'EOF'
          // DO NOT EDIT THIS FILE! IT IS GENERATED EACH TIME "capacitor update" IS RUN
          ext {
            cdvMinSdkVersion = project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
            // Plugin gradle extensions can append to this to have code run at the end.
            cdvPluginPostBuildExtras = []
            cordovaConfig = [:]
          }
          EOF
            cat > android/capacitor-cordova-android-plugins/src/main/AndroidManifest.xml <<'EOF'
          <?xml version='1.0' encoding='utf-8'?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
          xmlns:amazon="http://schemas.amazon.com/apk/res/android">
          <application  >

          </application>

          </manifest>
          EOF
            cat > android/capacitor-cordova-android-plugins/build.gradle <<'EOF'
          ext {
              androidxAppCompatVersion = project.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.7.1'
              cordovaAndroidVersion = project.hasProperty('cordovaAndroidVersion') ? rootProject.ext.cordovaAndroidVersion : '14.0.1'
          }

          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.13.0'
              }
          }

          apply plugin: 'com.android.library'

          android {
              namespace = "capacitor.cordova.android.plugins"
              compileSdk = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
              defaultConfig {
                  minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
                  targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36
                  versionCode 1
                  versionName "1.0"
              }
              lintOptions {
                  abortOnError = false
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_21
                  targetCompatibility JavaVersion.VERSION_21
              }
          }

          repositories {
              google()
              mavenCentral()
              flatDir{
                  dirs 'src/main/libs', 'libs'
              }
          }

          dependencies {
              implementation fileTree(dir: 'src/main/libs', include: ['*.jar'])
              implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
              implementation "org.apache.cordova:framework:$cordovaAndroidVersion"
              // SUB-PROJECT DEPENDENCIES START

              // SUB-PROJECT DEPENDENCIES END
          }

          // PLUGIN GRADLE EXTENSIONS START
          apply from: "cordova.variables.gradle"
          // PLUGIN GRADLE EXTENSIONS END

          for (def func : cdvPluginPostBuildExtras) {
              func()
          }
          EOF
          fi
          ls android/capacitor-cordova-android-plugins

      - name: Build debug APK
        run: |
          set +e
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon > /tmp/gradle.log 2>&1
          code=$?
          echo "gradle exit code: $code"
          tail -n 60 /tmp/gradle.log
          if [ $code -ne 0 ]; then tail -n 40 /tmp/gradle.log | sed 's/^/::error::/'; exit $code; fi
        working-directory: android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: striker-fc-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
